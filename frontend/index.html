<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>玄机先生 · AI 算命先生</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🔮%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <!-- 侧边栏 -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar__brand">
        <div class="brand__logo">☯</div>
        <div class="brand__text">
          <span class="brand__name">玄机先生</span>
          <span class="brand__sub">观星问卜 · 指点迷津</span>
        </div>
      </div>

      <button class="btn btn--new" id="new-chat">
        <span class="btn__icon">＋</span>
        <span>新对话</span>
      </button>

      <div class="sidebar__label">历史对话</div>
      <ul class="chat-list" id="chat-list"></ul>

      <div class="sidebar__footer">
        <button class="icon-btn" id="settings-toggle" title="设置">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
        <button class="icon-btn" id="theme-toggle" title="切换主题">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        </button>
        <button class="icon-btn" id="clear-chat" title="清空当前对话">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        </button>
      </div>
    </aside>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <!-- 主聊天区 -->
    <main class="chat">
      <header class="chat__header">
        <div class="chat__header-info">
          <div class="avatar avatar--header">玄</div>
          <div class="chat__heading">
            <div class="chat__title">玄机先生</div>
            <div class="chat__status" id="chat-status">
              <span class="dot"></span>
              <span id="status-text">连接中…</span>
              <span class="chat__model" id="model-name"></span>
            </div>
          </div>
        </div>
        <button class="icon-btn sidebar-toggle" id="sidebar-toggle" title="菜单">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
      </header>

      <div class="messages" id="messages"></div>

      <div class="composer">
        <div class="composer__box">
          <textarea id="input" rows="1" placeholder="想算什么？事业、姻缘、财运、起名、解梦…… Enter 发送，Ctrl+Enter 换行"></textarea>
          <button class="btn btn--send" id="send" title="发送">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22 11 13 2 9 22 2Z"/></svg>
          </button>
        </div>
        <div class="composer__hint">内容由 AI 生成 · 传统术数仅供文化参考，不替代医疗、法律与投资决策</div>
      </div>
    </main>
  </div>

  <!-- 术数面板 -->
  <div class="modal" id="divination-modal">
    <div class="modal__card modal__card--wide">
      <div class="modal__header">
        <h2 class="modal__title" id="divination-title">术数</h2>
        <button class="modal__close" id="divination-close" title="关闭">✕</button>
      </div>
      <div class="divination">
        <div class="divination__form" id="divination-form"></div>
      </div>
    </div>
  </div>

  <!-- 设置面板 -->
  <div class="modal" id="settings">
    <div class="modal__card">
      <div class="modal__header">
        <h2 class="modal__title">设置</h2>
        <button class="modal__close" id="settings-close" title="关闭">✕</button>
      </div>

      <div class="settings__section">
        <div class="settings__label">大模型</div>
        <div class="settings__models" id="model-options">
          <button class="model-option" data-model="deepseek-flash">
            <span class="model-option__name">⚡ deepseek-flash</span>
            <span class="model-option__desc">极速响应 · 日常测算首选</span>
          </button>
          <button class="model-option" data-model="deepseek-v4-pro">
            <span class="model-option__name">🧠 deepseek-v4-pro</span>
            <span class="model-option__desc">更强能力 · 更高质量解读</span>
          </button>
        </div>
      </div>

      <div class="settings__section">
        <div class="settings__label">API Key</div>
        <input class="settings__input" id="settings-api-key" type="password" placeholder="留空则使用默认 Key" />
        <div class="settings__hint">自定义 Key 无效时会自动回退到默认 Key</div>
      </div>

      <button class="btn btn--primary" id="settings-save">保存设置</button>
    </div>
  </div>

  <script src="js/vendor/axios.min.js"></script>
  <script src="js/vendor/marked.min.js"></script>
  <script src="js/vendor/purify.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
